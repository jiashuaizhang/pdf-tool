<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 处理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ff4d4f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v={{v}}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">PDF</span>
        <div>
          <strong>PDF 处理</strong>
          <em>本地工具</em>
        </div>
      </div>
      <div class="nav-label">功能</div>
      <nav>
        <button type="button" class="nav is-active" data-mode="split">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="4" y="3" width="16" height="18" rx="2"></rect>
            <path d="M12 4v16" stroke-dasharray="2 2"></path>
          </svg>
          拆分
        </button>
        <button type="button" class="nav" data-mode="merge">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="6" width="12" height="15" rx="2"></rect>
            <rect x="9" y="3" width="12" height="15" rx="2"></rect>
          </svg>
          合并
        </button>
      </nav>
    </aside>
    <div class="main">
      <header class="toolbar">
        <div class="toolbar-left">
          <button type="button" id="add" class="btn add">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="8"></circle>
              <path d="M12 8v8M8 12h8"></path>
            </svg>
            添加文件
          </button>
          <button type="button" id="selectAll" class="btn" hidden>全选</button>
          <button type="button" id="invert" class="btn" hidden>反选</button>
          <span id="count" class="count" hidden aria-live="polite"></span>
        </div>
        <label class="filename" id="filenameBox" hidden>
          <span class="filename-label">文件名</span>
          <input id="stem" type="text" spellcheck="false" autocomplete="off" maxlength="200" placeholder="请输入文件名" aria-label="文件名，不含扩展名">
          <span class="suffix">.pdf</span>
        </label>
        <button type="button" id="clear" class="btn ghost" hidden>清空</button>
      </header>
      <section id="stage" class="stage"></section>
      <button type="button" id="confirm" class="confirm" hidden>生成摘页（0 页）</button>
    </div>
  </div>
  <input id="picker" type="file" accept=".pdf,application/pdf" hidden>
  <div id="toast" class="toast" hidden role="status"></div>
  <div id="busy" class="busy" hidden>正在处理…</div>
  <div id="lightbox" class="lightbox" hidden>
    <button type="button" class="lightbox-backdrop" aria-label="关闭预览"></button>
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="lightboxCaption">
      <div class="lightbox-frame">
        <button type="button" id="lightboxClose" class="lightbox-close">关闭</button>
        <div id="lightboxBody" class="lightbox-body">正在加载预览…</div>
      </div>
      <p id="lightboxCaption"></p>
    </div>
    <div class="preview-zoom" role="group" aria-label="预览大小" title="按住 Ctrl 并滚动鼠标滚轮">
      <button type="button" id="previewZoomOut" aria-label="缩小" title="缩小">−</button>
      <button type="button" id="previewZoomIn" aria-label="放大" title="放大">+</button>
    </div>
  </div>
  <template id="card-template">
    <article class="card">
      <div class="thumb">
        <label class="check">
          <input type="checkbox">
        </label>
        <img alt="" draggable="false">
        <div class="actions">
          <button type="button" data-action="zoom" title="放大预览" aria-label="放大预览">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M9 4H4v5"></path>
              <path d="M15 4h5v5"></path>
              <path d="M20 15v5h-5"></path>
              <path d="M4 15v5h5"></path>
            </svg>
          </button>
          <button type="button" data-action="delete" title="删除" aria-label="删除此页">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 7h16"></path>
              <path d="M9 7V5h6v2"></path>
              <path d="M7 7l1 13h8l1-13"></path>
            </svg>
          </button>
        </div>
      </div>
      <p class="file"></p>
      <p class="num"></p>
    </article>
  </template>
  <script src="/static/app.js?v={{v}}"></script>
</body>
</html>
